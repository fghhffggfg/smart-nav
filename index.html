    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }

                linkBlog: "TechShare Blog", linkBili: "Bilibili", linkZhihu: "Zhihu", linkWeibo: "Weibo", linkJuejin: "Juejin",
                addCloud: "Add (Cloud)", addLocal: "Add (Local)", expandMore: "Show More", collapseMore: "Collapse",
                footerText: "&copy; 2026 TechShare Smart Nav · Powered by Cloudflare", adminBadge: "Logged In",
                modalAddCloud: "Add Cloud Link", modalAddFriend: "Add Friend Link", siteName: "Site Name", siteNamePlace: "e.g., Google", siteUrl: "Site URL",
                btnCancel: "Cancel", btnSave: "Save Site", noCloudLinks: "No custom links yet", loadingCloud: "Loading from cloud...",
                delConfirm: "Are you sure you want to delete this link?", pwdPrompt: "🔐 Enter Admin Password:", pwdSuccess: "🎉 Authenticated! Admin features unlocked.", pwdFail: "❌ Incorrect password!", logoutMsg: "🔒 Logged out safely. Read-only mode activated.",
                weatherCloudy: "Cloudy", weatherClear: "Clear", weatherRain: "Rain", weatherSnow: "Snow", weatherThunder: "Thunder", weatherDefault: "Good Weather · Clear", validUrlMsg: "Please enter a valid URL!",
                addSectionBtn: "Add Custom Section", promptSectionName: "Enter new section name (e.g., AI Tools):", delSectionConfirm: "Are you sure you want to delete this entire section?", modalAddSection: "Add to Custom Section",
                renameSectionPrompt: "Enter new section name:",
                pwdTitle: "Change Admin Password (Cloud Sync)", pwdInputPlace: "Enter new password", saveBtn: "Save", pwdUpdateSuccess: "Admin password updated successfully! Valid on next login."
            }
        };

        const dynamicLinkDict = {
            "https://kjgx668.blogspot.com": { zh: "科技共享博客", en: "TechShare Blog" },
            "https://kjgx.168668520.xyz": { zh: "科技共享导航", en: "TechShare Nav" },
            "https://it-toutiao.blogspot.com": { zh: "IT头条博客", en: "IT Toutiao Blog" }
        };

        function getLocalizedLinkName(originalName, url) {
            if (url && dynamicLinkDict[url]) return dynamicLinkDict[url][currentLang];
            return originalName;
        }
        function t(key) { return i18n[currentLang][key] || key; }
        function setLanguage(lang) {
            currentLang = lang; localStorage.setItem('nav_lang', lang); document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            applyLanguage(); updateClockAndGreeting(); renderWeather(); selectEngine(currentEngineKey); document.getElementById('theme-panel').classList.add('hidden');
        }
        function applyLanguage() {
            document.getElementById('page-title').innerText = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n')); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
            loadCustomLinks(); loadFriendLinks(); renderDynamicSections();
        }

        // --- 1. 管理员鉴权与密码设定 ---
        function checkAdminSession() {
            const isAdmin = localStorage.getItem('nav_admin_auth') === 'true';
            if (isAdmin) { document.body.classList.add('is-admin'); document.getElementById('admin-badge').classList.remove('hidden'); } 
            else { document.body.classList.remove('is-admin'); document.getElementById('admin-badge').classList.add('hidden'); }
        }
        
        function triggerAdminLogin() {
            if (localStorage.getItem('nav_admin_auth') === 'true') { alert(currentLang === 'zh' ? "提示：您已处于后台管理模式。" : "Notice: You are already in admin mode."); return; }
            const pwd = prompt(t('pwdPrompt'));
            if (pwd === null) return;
            
            const currentValidPwd = cloudConfig.adminPwd || "admin888";
            
            if (pwd === currentValidPwd) { 
                localStorage.setItem('nav_admin_auth', 'true'); alert(t('pwdSuccess')); checkAdminSession(); 
            } 
            else { alert(t('pwdFail')); }
        }
        
        function logoutAdmin() {
            localStorage.removeItem('nav_admin_auth'); alert(t('logoutMsg'));
            isCustomLinksExpanded = false; expandedDynamicSections = {}; checkAdminSession(); document.getElementById('theme-panel').classList.add('hidden');
        }

        async function updateAdminPwd() {
            const newPwd = document.getElementById('custom-pwd-input').value.trim();
            if (!newPwd) return;
            cloudConfig.adminPwd = newPwd;
            document.getElementById('custom-pwd-input').value = '';
            document.getElementById('theme-panel').classList.add('hidden');
            
            try { 
                await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cloudConfig) }); 
                alert(t('pwdUpdateSuccess'));
            } catch (e) { 
                console.error("云端密码同步失败", e); 
            }
        }

        // --- 2. 拖拽核心控制逻辑 ---
        function handleDragStart(e, type, secId, linkIdx = null) {
            e.stopPropagation(); 
            if (localStorage.getItem('nav_admin_auth') !== 'true') { e.preventDefault(); return; }
            dragType = type; dragSecId = secId; dragLinkIdx = linkIdx;
            e.dataTransfer.effectAllowed = 'move';
            const target = e.currentTarget;
            setTimeout(() => target.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            e.stopPropagation(); 
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.dynamic-section-card, .group').forEach(el => el.style.border = '');
        }

        function handleDragOver(e, type) { 
            e.preventDefault(); 
            e.stopPropagation(); 
            e.dataTransfer.dropEffect = 'move'; 
            return false; 
        }

        function handleDrop(e, type, targetSecId, targetLinkIdx = null) {
            e.stopPropagation(); 
            e.preventDefault();
            if (localStorage.getItem('nav_admin_auth') !== 'true') return;

            let secs = cloudConfig.dynamicSections || [];

            if (dragType === 'section' && type === 'section') {
                if (dragSecId === targetSecId) return;
                const fromIdx = secs.findIndex(s => s.id === dragSecId);
                const toIdx = secs.findIndex(s => s.id === targetSecId);
                if(fromIdx > -1 && toIdx > -1) {
                    const [moved] = secs.splice(fromIdx, 1);
                    secs.splice(toIdx, 0, moved);
                }
            } 
            else if (dragType === 'link' && type === 'link') {
                if (dragSecId === targetSecId && dragLinkIdx === targetLinkIdx) return;
                const fromSec = secs.find(s => s.id === dragSecId);
                const toSec = secs.find(s => s.id === targetSecId);
                if (fromSec && toSec) {
                    let actualTargetIdx = targetLinkIdx;
                    const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                    toSec.links.splice(actualTargetIdx, 0, movedLink);
                }
            } 
            else if (dragType === 'link' && type === 'section') {
                 const fromSec = secs.find(s => s.id === dragSecId);
                 const toSec = secs.find(s => s.id === targetSecId);
                 if (fromSec && toSec) {
                     if (fromSec === toSec) return; 
                     const [movedLink] = fromSec.links.splice(dragLinkIdx, 1);
                     toSec.links.push(movedLink);
                 }
            }

            cloudConfig.dynamicSections = secs;
            renderDynamicSections();
            saveCloudConfig();
        }

        // --- 3. 云端配置与数据管理 ---
        async function fetchCloudConfig() {
            try {
                const res = await fetch('/api/config');
                if(res.ok) {
                    const data = await res.json();
                    cloudConfig = data || {};
                }
            } catch(e) {
                console.warn("无法获取云端配置，将使用本地/默认模式", e);
            }
            if(!cloudConfig.dynamicSections || cloudConfig.dynamicSections.length === 0) {
                cloudConfig.dynamicSections = defaultSections;
            }
            if(cloudConfig.wallpaper) {
                setCustomBgUI(cloudConfig.wallpaper);
            }
            renderDynamicSections();
        }

        async function saveCloudConfig() {
            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudConfig)
                });
            } catch(e) {
                console.error("保存云端配置失败", e);
            }
        }

        // --- 4. 动态板块渲染 (包含“常用推荐”与“效率与开发”) ---
        function renderDynamicSections() {
            const container = document.getElementById('dynamic-sections-wrapper');
            if(!container) return;
            container.innerHTML = '';

            const secs = cloudConfig.dynamicSections || [];

            secs.forEach((sec) => {
                const isExpanded = expandedDynamicSections[sec.id] || false;
                const linksToDisplay = isExpanded ? sec.links : sec.links.slice(0, 6);

                let linksHtml = '';
                linksToDisplay.forEach((link, idx) => {
                    const iconClass = link.icon || 'fas fa-globe text-indigo-400';
                    linksHtml += `
                        <div class="relative group" 
                             draggable="true" 
                             ondragstart="handleDragStart(event, 'link', '${sec.id}', ${idx})" 
                             ondragend="handleDragEnd(event)" 
                             ondragover="handleDragOver(event, 'link')" 
                             ondrop="handleDrop(event, 'link', '${sec.id}', ${idx})">
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-indigo-600/20 transition-all">
                                <i class="${iconClass} text-xl"></i>
                                <span class="text-sm font-medium truncate">${getLocalizedLinkName(link.name, link.url)}</span>
                            </a>
                            <button onclick="deleteDynamicLink('${sec.id}', ${idx})" class="admin-only absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] hidden group-hover:flex items-center justify-center shadow hover:bg-red-600 cursor-pointer">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    `;
                });

                const expandBtnHtml = sec.links.length > 6 ? `
                    <div class="mt-4 pt-2 border-t border-slate-500/10 text-center">
                        <button onclick="toggleExpandDynamicSection('${sec.id}')" class="text-xs font-semibold ${sec.color || 'text-indigo-400'} hover:opacity-80 transition-colors cursor-pointer inline-flex items-center gap-1">
                            <span>${isExpanded ? t('collapseMore') : t('expandMore')}</span>
                            <i class="fas fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]"></i>
                        </button>
                    </div>
                ` : '';

                const secCard = document.createElement('div');
                secCard.className = "dynamic-section-card glass-card rounded-2xl p-6 shadow-xl hover:border-indigo-500/30 transition-all duration-300 xl:col-span-1";
                secCard.setAttribute('draggable', 'true');
                secCard.ondragstart = (e) => handleDragStart(e, 'section', sec.id);
                secCard.ondragend = handleDragEnd;
                secCard.ondragover = (e) => handleDragOver(e, 'section');
                secCard.ondrop = (e) => handleDrop(e, 'section', sec.id);

                secCard.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold ${sec.color || 'text-indigo-400'} flex items-center cursor-pointer" onclick="renameDynamicSection('${sec.id}')">
                            <i class="fas ${sec.icon || 'fa-folder'} mr-2.5"></i>
                            <span>${sec.name}</span>
                        </h3>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="openLinkModal('${sec.id}')" class="admin-only text-xs px-2.5 py-1 bg-indigo-600/20 text-indigo-400 border border-indigo-500/20 rounded-lg hover:bg-indigo-600/40 transition-colors cursor-pointer" data-i18n="addCloud">${t('addCloud')}</button>
                            <button type="button" onclick="deleteDynamicSection('${sec.id}')" class="admin-only text-xs px-2 py-1 bg-red-600/20 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-600/40 transition-colors cursor-pointer"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 min-h-[50px]">
                        ${linksHtml}
                    </div>
                    ${expandBtnHtml}
                `;

                container.appendChild(secCard);
            });
        }

        function toggleExpandDynamicSection(secId) {
            expandedDynamicSections[secId] = !expandedDynamicSections[secId];
            renderDynamicSections();
        }

        function addCustomSection() {
            const name = prompt(t('promptSectionName'));
            if(!name || !name.trim()) return;
            const newSec = {
                id: 'sec_' + Date.now(),
                name: name.trim(),
                icon: 'fa-folder',
                color: 'text-indigo-400',
                links: []
            };
            cloudConfig.dynamicSections.push(newSec);
            renderDynamicSections();
            saveCloudConfig();
        }

        function renameDynamicSection(secId) {
            if(localStorage.getItem('nav_admin_auth') !== 'true') return;
            const sec = cloudConfig.dynamicSections.find(s => s.id === secId);
            if(!sec) return;
            const newName = prompt(t('renameSectionPrompt'), sec.name);
            if(newName && newName.trim()) {
                sec.name = newName.trim();
                renderDynamicSections();
                saveCloudConfig();
            }
        }

        function deleteDynamicSection(secId) {
            if(!confirm(t('delSectionConfirm'))) return;
            cloudConfig.dynamicSections = cloudConfig.dynamicSections.filter(s => s.id !== secId);
            renderDynamicSections();
            saveCloudConfig();
        }

        function deleteDynamicLink(secId, linkIdx) {
            if(!confirm(t('delConfirm'))) return;
            const sec = cloudConfig.dynamicSections.find(s => s.id === secId);
            if(sec) {
                sec.links.splice(linkIdx, 1);
                renderDynamicSections();
                saveCloudConfig();
            }
        }

        // --- 5. 传统站长推荐 & 友情链接逻辑 ---
        async function loadCustomLinks() {
            const container = document.getElementById('custom-links-container');
            if(!container) return;
            try {
                const res = await fetch('/api/links');
                if(res.ok) {
                    const links = await res.json();
                    renderCustomLinksUI(links);
                }
            } catch(e) {
                container.innerHTML = `<div class="text-xs text-slate-500">${t('noCloudLinks')}</div>`;
            }
        }

        function renderCustomLinksUI(links) {
            const container = document.getElementById('custom-links-container');
            const wrapper = document.getElementById('expand-action-wrapper');
            if(!container) return;
            container.innerHTML = '';
            
            if(!links || links.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 py-2">${t('noCloudLinks')}</div>`;
                if(wrapper) wrapper.classList.add('hidden');
                return;
            }

            const linksToDisplay = isCustomLinksExpanded ? links : links.slice(0, 6);
            let html = '<div class="grid grid-cols-2 gap-3">';
            linksToDisplay.forEach((link, idx) => {
                html += `
                    <div class="relative group">
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3 p-3 bg-slate-500/5 rounded-xl hover:bg-pink-600/20 transition-all">
                            <i class="fas fa-bookmark text-xl text-pink-400"></i>
                            <span class="text-sm font-medium truncate">${getLocalizedLinkName(link.name, link.url)}</span>
                        </a>
                        <button onclick="deleteCustomLink(${idx})" class="admin-only absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] hidden group-hover:flex items-center justify-center shadow hover:bg-red-600 cursor-pointer">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            if(wrapper) {
                if(links.length > 6) {
                    wrapper.classList.remove('hidden');
                    document.getElementById('expand-btn').innerHTML = `<span>${isCustomLinksExpanded ? t('collapseMore') : t('expandMore')}</span> <i class="fas fa-chevron-${isCustomLinksExpanded ? 'up' : 'down'} text-[10px]"></i>`;
                } else {
                    wrapper.classList.add('hidden');
                }
            }
        }

        function toggleExpandCustomLinks() {
            isCustomLinksExpanded = !isCustomLinksExpanded;
            loadCustomLinks();
        }

        async function deleteCustomLink(index) {
            if(!confirm(t('delConfirm'))) return;
            try {
                await fetch(`/api/links?index=${index}`, { method: 'DELETE' });
                loadCustomLinks();
            } catch(e) { console.error(e); }
        }

        function loadFriendLinks() {
            const container = document.getElementById('friend-links-container');
            if(!container) return;
            const friends = JSON.parse(localStorage.getItem('friend_links') || '[]');
            container.innerHTML = '';
            friends.forEach((link, idx) => {
                container.innerHTML += `
                    <div class="relative group">
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-2.5 bg-slate-500/5 rounded-xl hover:bg-emerald-600/20 transition-all text-xs font-medium text-slate-300 hover:text-emerald-400 truncate">
                            ${link.name}
                        </a>
                        <button onclick="deleteFriendLink(${idx})" class="admin-only absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full text-[9px] hidden group-hover:flex items-center justify-center shadow hover:bg-red-600 cursor-pointer">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            });
        }

        function deleteFriendLink(idx) {
            if(!confirm(t('delConfirm'))) return;
            const friends = JSON.parse(localStorage.getItem('friend_links') || '[]');
            friends.splice(idx, 1);
            localStorage.setItem('friend_links', JSON.stringify(friends));
            loadFriendLinks();
        }

        // --- 6. 模态框与保存逻辑 ---
        function openLinkModal(target) {
            currentModalTarget = target;
            const titleText = document.getElementById('modal-title-text');
            if(target === 'custom') titleText.innerText = t('modalAddCloud');
            else if(target === 'friend') titleText.innerText = t('modalAddFriend');
            else titleText.innerText = t('modalAddSection');
            
            document.getElementById('site-name').value = '';
            document.getElementById('site-url').value = '';
            toggleModal(true);
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function closeModalOnBlank(e) {
            if(e.target.id === 'modal') toggleModal(false);
        }

        async function saveActiveLink() {
            const name = document.getElementById('site-name').value.trim();
            let url = document.getElementById('site-url').value.trim();
            if(!name || !url) { alert(t('validUrlMsg')); return; }
            if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

            if(currentModalTarget === 'custom') {
                try {
                    await fetch('/api/links', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, url })
                    });
                    loadCustomLinks();
                } catch(e) { console.error(e); }
            } else if(currentModalTarget === 'friend') {
                const friends = JSON.parse(localStorage.getItem('friend_links') || '[]');
                friends.push({ name, url });
                localStorage.setItem('friend_links', JSON.stringify(friends));
                loadFriendLinks();
            } else {
                // 保存到动态板块
                const sec = cloudConfig.dynamicSections.find(s => s.id === currentModalTarget);
                if(sec) {
                    sec.links.push({ name, url, icon: 'fas fa-globe text-indigo-400' });
                    renderDynamicSections();
                    saveCloudConfig();
                }
            }
            toggleModal(false);
        }

        // --- 7. 主题与背景设置 ---
        function toggleThemeMenu(e) {
            e.stopPropagation();
            document.getElementById('theme-panel').classList.toggle('hidden');
        }

        function setBaseTheme(theme) {
            document.body.className = theme + (document.body.classList.contains('is-admin') ? ' is-admin' : '') + (cloudConfig.wallpaper ? ' has-custom-bg' : '');
            localStorage.setItem('nav_theme', theme);
        }

        function applyCustomBg() {
            const url = document.getElementById('custom-bg-input').value.trim();
            if(!url) return;
            cloudConfig.wallpaper = url;
            setCustomBgUI(url);
            saveCloudConfig();
        }

        function setCustomBgUI(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
            document.body.classList.add('has-custom-bg');
            document.getElementById('clear-bg-btn').classList.remove('hidden');
        }

        function clearCustomBg() {
            cloudConfig.wallpaper = "";
            document.body.style.backgroundImage = '';
            document.body.classList.remove('has-custom-bg');
            document.getElementById('clear-bg-btn').classList.add('hidden');
            document.getElementById('custom-bg-input').value = '';
            saveCloudConfig();
        }

        // --- 8. 搜索引擎切换逻辑 ---
        const engines = {
            google: { action: "https://www.google.com/search", name: "q", icon: "fab fa-google text-blue-400", placeholderKey: "searchGoogle" },
            bing: { action: "https://www.bing.com/search", name: "q", icon: "fab fa-microsoft text-teal-400", placeholderKey: "searchBing" },
            baidu: { action: "https://www.baidu.com/s", name: "wd", icon: "fas fa-paw text-red-400", placeholderKey: "searchBaidu" },
            github: { action: "https://github.com/search", name: "q", icon: "fab fa-github text-slate-400", placeholderKey: "searchGithub" }
        };

        function toggleEngineMenu(e) {
            e.stopPropagation();
            document.getElementById('engine-menu').classList.toggle('hidden');
        }

        function selectEngine(key) {
            currentEngineKey = key;
            const conf = engines[key];
            const form = document.getElementById('search-form');
            const input = document.getElementById('search-input');
            const icon = document.getElementById('engine-icon');
            
            form.action = conf.action;
            input.name = conf.name;
            input.placeholder = t(conf.placeholderKey);
            icon.className = conf.icon;
            document.getElementById('engine-menu').classList.add('hidden');
        }

        // --- 9. 时间与天气组件 ---
        function updateClockAndGreeting() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;

            const hour = now.getHours();
            let greetingStr = '';
            if(hour < 6) greetingStr = currentLang === 'zh' ? '夜深了，注意休息' : 'Late night, take rest';
            else if(hour < 12) greetingStr = currentLang === 'zh' ? '早安，祝今天好心情' : 'Good morning!';
            else if(hour < 18) greetingStr = currentLang === 'zh' ? '下午好，保持高效' : 'Good afternoon!';
            else greetingStr = currentLang === 'zh' ? '晚上好，享受时光' : 'Good evening!';
            document.getElementById('greeting').innerText = greetingStr;
        }

        async function renderWeather() {
            const weatherEl = document.getElementById('weather-info');
            try {
                const res = await fetch('https://wttr.in/?format=j1');
                if(res.ok) {
                    const data = await res.json();
                    const condition = data.current_condition[0];
                    const temp = condition.temp_C;
                    weatherEl.innerHTML = `<i class="fas fa-sun text-amber-400"></i> <span>${temp}°C</span>`;
                    return;
                }
            } catch(e) {}
            weatherEl.innerHTML = `<i class="fas fa-cloud-sun text-emerald-400"></i> <span>${t('weatherDefault')}</span>`;
        }

        // 全局事件监听：点击空白关闭弹窗与浮窗
        window.onclick = function() {
            document.getElementById('theme-panel').classList.add('hidden');
            document.getElementById('engine-menu').classList.add('hidden');
        };

        // 初始化运行
        window.addEventListener('DOMContentLoaded', () => {
            const localTheme = localStorage.getItem('nav_theme') || 'theme-dark';
            setBaseTheme(localTheme);
            checkAdminSession();
            applyLanguage();
            fetchCloudConfig();
            
            setInterval(updateClockAndGreeting, 1000);
            updateClockAndGreeting();
            renderWeather();
        });
    </script>
</body>
